<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">Cardiac organoid assessment workflow</title>
  <desc id="desc">Heart references and organoid transcriptomes undergo processing and consensus annotation. Four branches assess identity with Cepo, maturity with CytoTRACE2 and entropy, regional mapping with atrial and ventricular modules, and off-target cells with sequential fetal heart and multi-organ mapping.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7E91A6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="920" rx="20" fill="#F6F8FB" stroke="none"/>
  <text x="40" y="53" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#172B45">From transcriptomes to organoid assessment</text>
  <text x="40" y="86" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">A shared preparation stage, followed by complementary analysis modules</text>
  <rect x="40" y="120" width="530" height="116" rx="16" fill="#FFFFFF" stroke="#DDE4ED"/>
  <text x="64" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172B45">Human heart references</text>
  <text x="64" y="184" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#53677E">Adult &amp; fetal heart transcriptomes</text>
  <text x="64" y="214" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#53677E">Modality-specific reference inputs</text>
  <rect x="630" y="120" width="530" height="116" rx="16" fill="#FFFFFF" stroke="#DDE4ED"/>
  <text x="654" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172B45">Cardiac organoid datasets</text>
  <text x="654" y="184" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#53677E">22 single-cell + 4 single-nucleus subsets</text>
  <text x="654" y="214" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#53677E">Split by study, time point, chamber or condition</text>
  <path d="M305 236 V260 H600 M895 236 V260 H600 V289" fill="none" stroke="#7E91A6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="291" width="600" height="111" rx="16" fill="#E9EFF5" stroke="#CAD6E3"/>
  <text x="600" y="324" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172B45" text-anchor="middle">Processing &amp; consensus annotation</text>
  <text x="600" y="355" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#384F69" text-anchor="middle">scClassify · Seurat label transfer · SingleR</text>
  <text x="600" y="383" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#53677E" text-anchor="middle">Separate single-cell and single-nucleus analyses</text>
  <path d="M600 402 V738" fill="none" stroke="#7E91A6" stroke-width="2"/>
  <path d="M600 534 H574" fill="none" stroke="#7E91A6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="446" width="530" height="177" rx="16" fill="#FFFFFF" stroke="#DDE4ED"/>
  <rect x="40" y="464" width="5" height="140" rx="2" fill="#D45973"/>
  <text x="64" y="483" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#D45973">01</text>
  <text x="102" y="483" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172B45">Cell identity</text>
  <rect x="465" y="463" width="85" height="28" rx="14" fill="#EEF2F6" stroke="none"/>
  <text x="507" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#53677E" text-anchor="middle">SC + SN</text>
  <text x="64" y="525" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#172B45">Cepo gene specificity</text>
  <text x="64" y="558" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#53677E">Reference correlations + organoid subsampling</text>
  <text x="64" y="595" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#D45973">How similar are cell-type gene programs?</text>
  <path d="M600 534 H626" fill="none" stroke="#7E91A6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="630" y="446" width="530" height="177" rx="16" fill="#FFFFFF" stroke="#DDE4ED"/>
  <rect x="630" y="464" width="5" height="140" rx="2" fill="#238D9C"/>
  <text x="654" y="483" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#238D9C">02</text>
  <text x="692" y="483" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172B45">Maturity</text>
  <rect x="1055" y="463" width="85" height="28" rx="14" fill="#EEF2F6" stroke="none"/>
  <text x="1097" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#53677E" text-anchor="middle">SC + SN</text>
  <text x="654" y="525" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#172B45">CytoTRACE2 + expression entropy</text>
  <text x="654" y="558" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#53677E">Transcriptomic differentiation / maturity measures</text>
  <text x="654" y="595" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#238D9C">How do transcriptional measures compare?</text>
  <path d="M600 738 H574" fill="none" stroke="#7E91A6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="650" width="530" height="177" rx="16" fill="#FFFFFF" stroke="#DDE4ED"/>
  <rect x="40" y="668" width="5" height="140" rx="2" fill="#6675BB"/>
  <text x="64" y="687" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#6675BB">03</text>
  <text x="102" y="687" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172B45">Regional mapping</text>
  <rect x="465" y="667" width="85" height="28" rx="14" fill="#EEF2F6" stroke="none"/>
  <text x="507" y="686" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#53677E" text-anchor="middle">SC + SN</text>
  <text x="64" y="729" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#172B45">Atrial / ventricular gene modules</text>
  <text x="64" y="762" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#53677E">Cardiomyocyte scores + unresolved assignments</text>
  <text x="64" y="799" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6675BB">Which chamber characteristics are represented?</text>
  <path d="M600 738 H626" fill="none" stroke="#7E91A6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="630" y="650" width="530" height="177" rx="16" fill="#FFFFFF" stroke="#DDE4ED"/>
  <rect x="630" y="668" width="5" height="140" rx="2" fill="#BB812C"/>
  <text x="654" y="687" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#BB812C">04</text>
  <text x="692" y="687" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172B45">Off-target annotation</text>
  <rect x="1055" y="667" width="85" height="28" rx="14" fill="#EEF2F6" stroke="none"/>
  <text x="1097" y="686" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#53677E" text-anchor="middle">SC only</text>
  <text x="654" y="729" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#172B45">Unassigned → fetal heart → multi-organ</text>
  <text x="654" y="762" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#53677E">Fetal-heart consensus, then Cao Azimuth mapping</text>
  <text x="654" y="799" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#BB812C">What might explain cells left unassigned?</text>
  <text x="40" y="870" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#53677E">SC: single-cell RNA-seq · SN: single-nucleus RNA-seq · Subsets are not biological replicate counts.</text>
  <text x="40" y="896" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#53677E">Conceptual workflow; no measured results are shown. External inputs and module-specific preparation are required.</text>
</svg>
